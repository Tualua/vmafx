name: Hardware report
description: Send the JSON report of a tester package (macOS bundle, container image, or the Intel, NVIDIA or AMD GPU image).
title: "[hardware report] "
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for running the tester (see `docs/usage/tester-image.md`; the hardware
        that is still missing is listed in `docs/usage/hardware-we-need.md`). Attach the
        `report.json` it printed. It holds no host name, user name or serial number;
        read it before you attach it. A report with verdict `fail` is welcome.

  - type: textarea
    id: report
    attributes:
      label: report.json
      description: Drag the file into this box, or paste its content.
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Which package did you run?
      options:
        - macOS bundle (native)
        - Container image
        - Intel GPU image (tester-sycl)
        - NVIDIA GPU image (tester-cuda)
        - AMD GPU image (tester-hip)
        - Other / built from source
    validations:
      required: true

  - type: input
    id: machine
    attributes:
      label: Machine
      description: For example "MacBook Air, Apple M4, macOS 15.1", "Docker Desktop 4.40 on the same Mac", "Ryzen 7 7840U with Radeon 780M, Linux 6.12" or "GeForce RTX 3080, Windows 11 with WSL2".
    validations:
      required: false

  - type: input
    id: credit
    attributes:
      label: Credit (optional)
      description: >-
        Name and e-mail address for a `Co-authored-by:` line when a maintainer
        commits the report for you. Leave empty to stay unnamed.
    validations:
      required: false
