<svg role="img" aria-labelledby="figure-title figure-desc" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1006.8" height="336" viewBox="0 0 1006.8 336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="figure-title">From a pull request to a published release</title>
<desc id="figure-desc">A PR passes its gates and the merge train, lands on master, and release-please and an operator turn master into a release.</desc>
<!-- interfig (c) 2025 Vectorize AI, Inc. MIT https://github.com/vectorize-io/hindsight/tree/ccfe85b4851957ac2adf88b4a9ddf9668b2882f1/hindsight-interfig -->
<metadata id="figure-spec"><![CDATA[{"props":{"layout":{"direction":"column","gap":34,"children":[{"id":"land","label":"Landing","direction":"row","gap":46,"children":[{"id":"pr","label":"Pull request","sub":"Conventional Commit title"},{"id":"checks","label":"PR gates","sub":"deliverables, state.md, audit"},{"id":"train","label":"Merge train","sub":"make lint, make test"},{"id":"master","label":"master","sub":"squashed commit","shape":"store"}]},{"id":"release","label":"Release","direction":"row","gap":46,"children":[{"id":"rp","label":"release-please","sub":"release PR, version bump"},{"id":"draft","label":"Draft release","sub":"merged release PR"},{"id":"publish","label":"Operator publishes","sub":"creates the vX.Y.Z tag","shape":"decision","width":200},{"id":"artifacts","label":"Publication workflows","sub":"build, sign, attest, publish"}]}]},"edges":[{"from":"pr","to":"checks"},{"from":"checks","to":"train"},{"from":"train","to":"master","label":"fast-forward"},{"from":"master","to":"rp","label":"push"},{"from":"rp","to":"draft","label":"merge"},{"from":"draft","to":"publish"},{"from":"publish","to":"artifacts","label":"release.published"}],"steps":[{"label":"Land","caption":"A pull request becomes one commit on master.","flow":[{"edges":"pr->checks","say":"The PR body carries the deliverables; the gates check it and the diff."},{"edges":"checks->train","say":"The merge train restacks the PR, builds and runs the tests."},{"edges":"train->master","say":"It lands as one squashed commit, fast-forward."}]},{"label":"Release","caption":"master becomes a published release.","flow":[{"edges":"master->rp","say":"release-please reads the commit titles and opens the release PR."},{"edges":"rp->draft","say":"Merging the release PR creates a draft release, no tag yet."},{"edges":"draft->publish","say":"An operator publishes the draft; that creates the tag."},{"edges":"publish->artifacts","say":"The workflows check out the tag, sign and publish."}]}]}}]]></metadata>
