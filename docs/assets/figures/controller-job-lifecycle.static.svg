<metadata id="figure-spec"><![CDATA[{"props":{"layout":{"direction":"column","gap":44,"children":[{"direction":"row","gap":44,"children":[{"id":"client","label":"Client","sub":"SubmitJob, CancelJob"},{"id":"controller","label":"vmafx-controller","sub":"queue, node registry, scheduler","width":250},{"id":"node","label":"vmafx-node","sub":"RegisterNode, Heartbeat"}]},{"id":"states","label":"Job status in the queue","direction":"row","gap":26,"children":[{"id":"pending","label":"pending"},{"id":"running","label":"running"},{"direction":"column","gap":14,"children":[{"id":"completed","label":"completed"},{"id":"failed","label":"failed"},{"id":"cancelled","label":"cancelled"}]}]}]},"edges":[{"from":"client","to":"controller","label":"SubmitJob"},{"from":"node","to":"controller","label":"PullWork"},{"id":"report","from":"node","to":"controller","label":"ReportResult","around":"above"},{"from":"pending","to":"running","label":"PullWork"},{"from":"running","to":"completed","label":"ok"},{"from":"running","to":"failed","label":"error"},{"from":"pending","to":"cancelled","label":"CancelJob","around":"below","quiet":true},{"from":"running","to":"cancelled","label":"CancelJob","quiet":true},{"id":"evict","from":"running","to":"pending","label":"node evicted","around":"above","quiet":true}],"steps":[{"label":"Job runs","caption":"A submitted job is pulled by a matching node and reported.","flow":[{"edges":"client->controller","say":"The client submits a job; it is pending.","light":["pending"]},{"edges":"node->controller","say":"A node with the required backend pulls work."},{"edges":"pending->running","say":"The scheduler assigns the oldest matching job."},{"edges":"report","say":"The node reports the result."},{"edges":"running->completed","say":"The job is completed, or failed on an error."}]},{"label":"Node lost","caption":"An evicted node gives its jobs back.","flow":[{"edges":"pending->running","say":"A node runs a job."},{"edges":"evict","say":"No heartbeat for 60 s: the node is evicted and the job is pending again."}]}]}}]]></metadata>
