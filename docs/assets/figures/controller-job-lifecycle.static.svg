<svg role="img" aria-labelledby="figure-title figure-desc" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="723.5" height="423" viewBox="0 0 723.5 423" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="figure-title">Controller: node API and job lifecycle</title>
<desc id="figure-desc">Nodes register, send heartbeats, pull matching pending jobs and report results; a job ends completed, failed or cancelled.</desc>
