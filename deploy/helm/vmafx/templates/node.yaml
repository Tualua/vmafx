{{- /*
  templates/node.yaml — vmafx-node worker pool Deployment.

  This template deploys the vmafx-node Go worker pool, enabled via
  .Values.node.enabled. With controller.enabled the nodes register with the
  chart's controller (templates/controller.yaml, ADR-1589) unless
  node.controllerAddr names another one; node.controllerToken mounts the
  node's bearer token.

  GPU vendor → Kubernetes resource mapping (vmafx.gpuResourceName; an explicit
  gpu.resourceName overrides it):
    nvidia  → nvidia.com/gpu                   (requires nvidia-device-plugin DaemonSet)
    amd     → amd.com/gpu                      (requires amdgpu-device-plugin DaemonSet)
    intel   → gpu.intel.com/<gpu.intelDriver>  (i915 or xe; requires intel-gpu-plugin DaemonSet)
    cpu     → (no GPU resource requested)

  ADR-0709: Phase 4b distributed platform umbrella.
  ADR-0713: vmafx-node Go worker binary.
  ADR-0719: rclone integration for remote asset resolution.
  ADR-1593: node.fuse (FUSE device resource, the capability bounding set the
  setuid fusermount3 needs) and node.ebpf (VMAFX_EBPF_BYPASS, UID 0 with
  BPF / PERFMON / SYS_ADMIN, /sys/kernel/tracing read-only);
  templates/node-validate.yaml refuses combinations the node cannot run.

  Note: this template superseded the legacy templates/node-deployment.yaml,
  which rendered a duplicate Deployment under the same name and blocked
  `helm install`.  The rclone Secret mount + storage-mode / model-dir env
  vars from that template have been folded in here.  The legacy template
  used VMAFX_NODE_NAME; this one uses VMAFX_NODE_ID per ADR-0713.

  See: docs/development/node.md, docs/development/gpu-scheduling.md.
*/}}
{{- if .Values.node.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vmafx.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  replicas: {{ .Values.node.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "vmafx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node
  # Explicit zero-disruption rolling-update strategy for GPU worker pods.
  # maxUnavailable: 0 ensures no in-flight scoring job is SIGKILL'd before
  # its replacement is healthy; maxSurge: 1 permits one extra pod during
  # the rollout so capacity is never reduced.  Without this, Kubernetes
  # defaults to 25%/25% which can evict pods that hold live GPU work.
  strategy:
    {{- toYaml .Values.node.strategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "vmafx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "vmafx.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 60 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.node.nodeSelector | nindent 8 }}
      {{- else if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.node.tolerations }}
      tolerations:
        {{- toYaml .Values.node.tolerations | nindent 8 }}
      {{- else if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      containers:
        - name: vmafx-node
          image: {{ include "vmafx.nodeImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.node.grpcPort | default 50052 }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.node.metricsPort | default 9090 }}
              protocol: TCP
          env:
            {{- with include "vmafx.nodeControllerAddr" . }}
            # The node's controller client registers here and pulls jobs; unset
            # (no controller) the node serves direct scoring only.
            - name: VMAFX_CONTROLLER_ADDR
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.node.controllerToken.secretName }}
            # Bearer token (vmafx:node), re-read on every call (ADR-1524).
            - name: VMAFX_CONTROLLER_TOKEN_FILE
              value: {{ include "vmafx.controllerTokenPath" . | quote }}
            {{- end }}
            # The binary defaults grpc.listen to :50052 for standalone use.
            # Pin it explicitly to deploy's configurable grpcPort so the
            # ClusterIP Service and tcpSocket probes always follow chart values.
            - name: VMAFX_GRPC_LISTEN
              value: ":{{ .Values.node.grpcPort | default 50052 }}"
            # The HTTP listener of /metrics and the probe endpoints; pinned to
            # node.metricsPort so the container port, the Service port, the
            # NetworkPolicy and the node's ServiceMonitor follow chart values.
            - name: VMAFX_HTTP_ADDR
              value: ":{{ .Values.node.metricsPort | default 9090 }}"
            - name: VMAFX_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VMAFX_BACKEND
              value: {{ include "vmafx.backendEnvValue" . | quote }}
            # Storage / scoring env vars folded in from the legacy
            # templates/node-deployment.yaml (ADR-0719 rclone integration).
            - name: VMAFX_STORAGE_MODE
              value: {{ .Values.storage.mode | default "http-serve" | quote }}
            {{- with include "vmafx.nodeMountRoot" . }}
            - name: VMAFX_STORAGE_MOUNT_ROOT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.node.ebpf.enabled }}
            # eBPF descriptor tracker (ADR-1539); the node stops at startup
            # when the host cannot run it.
            - name: VMAFX_EBPF_BYPASS
              value: "1"
            - name: VMAFX_EBPF_MOUNT_PREFIX
              value: {{ .Values.node.ebpf.mountPrefix | quote }}
            {{- end }}
            {{- if .Values.storage.rclone.config }}
            # Only with the rclone Secret mounted below; without it rclone uses
            # its own defaults (on-the-fly remotes such as :s3,env_auth:).
            - name: VMAFX_RCLONE_CONFIG
              value: "/etc/vmafx/rclone.conf"
            {{- end }}
            - name: VMAFX_VMAF_BINARY
              value: "/usr/local/bin/vmaf"
            # The models volume when it is mounted, else the models the node
            # image ships (persistence.models.mountPath always has a value).
            - name: VMAFX_MODEL_DIR
              value: {{ ternary .Values.persistence.models.mountPath "/usr/local/share/vmafx/model" .Values.persistence.models.enabled | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range .Values.envFrom }}
            {{- end }}
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          resources:
            {{- $nodeResources := .Values.node.resources | default .Values.resources }}
            limits:
              {{- toYaml $nodeResources.limits | nindent 14 }}
              {{- if and .Values.gpu.enabled (ne .Values.gpu.vendor "cpu") }}
              {{- include "vmafx.gpuResourceName" . | nindent 14 }}: {{ .Values.gpu.count | default 1 }}
              {{- end }}
              {{- if .Values.node.fuse.enabled }}
              # /dev/fuse from the FUSE device plugin (ADR-1593).
              {{ .Values.node.fuse.resourceName }}: 1
              {{- end }}
            requests:
              {{- toYaml $nodeResources.requests | nindent 14 }}
          securityContext:
            {{- include "vmafx.nodeSecurityContext" . | nindent 12 }}
          # tcpSocket probes verify the gRPC listener is accepting connections
          # (ADR-1094). The node also serves /metrics and its probe endpoints
          # over HTTP on node.metricsPort (VMAFX_HTTP_ADDR); the probes stay
          # on the gRPC listener, which is what the controller dispatches to.
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if include "vmafx.nodeMountRootVolume" . }}
            - name: mount-root
              mountPath: {{ include "vmafx.nodeMountRoot" . | quote }}
            {{- end }}
            {{- if .Values.node.ebpf.enabled }}
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            {{- end }}
            {{- if .Values.storage.rclone.config }}
            - name: rclone-config
              mountPath: /etc/vmafx
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.models.enabled }}
            - name: models
              mountPath: {{ .Values.persistence.models.mountPath }}
              readOnly: true
            {{- end }}
            {{- include "vmafx.controllerTokenMount" (dict "token" .Values.node.controllerToken) | nindent 12 }}
            {{- with .Values.node.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if include "vmafx.nodeMountRootVolume" . }}
        - name: mount-root
          emptyDir: {}
        {{- end }}
        {{- if .Values.node.ebpf.enabled }}
        # The host's tracefs: the eBPF loader looks up the syscall
        # tracepoint ids there (read-only; the program attaches through
        # perf_event_open, not through tracefs writes).
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        {{- end }}
        {{- if .Values.storage.rclone.config }}
        - name: rclone-config
          secret:
            secretName: {{ include "vmafx.fullname" . }}-rclone-config
            defaultMode: 0400
        {{- end }}
        {{- if .Values.persistence.models.enabled }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "vmafx.fullname" . }}-models
            readOnly: true
        {{- end }}
        {{- include "vmafx.controllerTokenVolume" (dict "token" .Values.node.controllerToken) | nindent 8 }}
        {{- with .Values.node.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
# ClusterIP Service for controller → node gRPC dispatch (ADR-0713) and the
# node's /metrics page on node.metricsPort, which the node ServiceMonitor
# scrapes (monitoring.components.node, ADR-2349).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vmafx.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  type: ClusterIP
  selector:
    {{- include "vmafx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: node
  ports:
    - name: grpc
      port: {{ .Values.node.grpcPort | default 50052 }}
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: {{ .Values.node.metricsPort | default 9090 }}
      targetPort: metrics
      protocol: TCP
{{- end }}
