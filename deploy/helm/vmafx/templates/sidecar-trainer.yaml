{{- /*
  sidecar-trainer.yaml — optional online-training sidecar container snippet.

  When .Values.sidecar.trainer.enabled is true this file renders a
  PodTemplate patch that adds the vmafx-sidecar container alongside
  vmafx-node inside the same pod.  The patch is consumed by the
  node-deployment.yaml template via the {{ include "vmafx.sidecarContainer" . }}
  helper so both containers share the /tmp emptyDir volume (and therefore
  the Unix socket at /tmp/vmafx-sidecar.sock).

  ADR-0781: sidecar online training — SGD + EMA + replay buffer.
*/}}

{{- define "vmafx.sidecarContainer" -}}
{{- if .Values.sidecar.trainer.enabled }}
- name: vmafx-sidecar
  image: {{ .Values.sidecar.trainer.image.repository }}:{{ .Values.sidecar.trainer.image.tag | default .Chart.AppVersion }}
  imagePullPolicy: {{ .Values.sidecar.trainer.image.pullPolicy | default "IfNotPresent" }}
  command: ["python", "-m", "ai.sidecar.online_trainer"]
  env:
    {{- include "vmafx.env.sidecar" . }}
    {{- range $k, $v := .Values.sidecar.trainer.env }}
    - name: {{ $k | quote }}
      value: {{ $v | quote }}
    {{- end }}
  resources:
    {{- toYaml .Values.sidecar.trainer.resources | nindent 4 }}
  volumeMounts:
    # Shared with vmafx-node for the Unix socket.
    - name: tmp
      mountPath: /tmp
    # Model PVC — read the base model and write checkpoints.
    {{- if .Values.persistence.models.enabled }}
    - name: models
      mountPath: {{ .Values.persistence.models.mountPath }}
    {{- end }}
  readinessProbe:
    exec:
      # The sidecar is ready once it has bound the Unix socket.
      command:
        - python
        - -c
        - |
          import socket, sys
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          try:
              s.connect('/tmp/vmafx-sidecar.sock')
              s.close()
          except OSError:
              sys.exit(1)
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 6
  # k8s 1.29+ native sidecar: always restart with the pod.
  # On older clusters this is ignored (treated as a regular container).
  restartPolicy: Always
{{- end }}
{{- end }}
