{{- /*
SPDX-License-Identifier: EUPL-1.2
Copyright 2026 Lusoris

deploy/helm/vmafx/templates/auth-validate.yaml
Renders nothing. Refuses auth settings that the rendered workload would not
apply, instead of deploying a server that silently runs without them.

- The auth gateway is part of vmafx-controller, deployed with
  controller.enabled (ADR-1589); auth.enabled and controller.enabled go
  together. The server workload no longer receives auth settings, so an
  image.repository naming a controller image is refused instead of running a
  controller without them.
- A tenant registry cannot be combined with auth.disabled, and auth.tenants /
  auth.tenantSource mean nothing without auth.enabled.
- auth.scoringRoots applies without a tenant registry only, and needs
  auth.enabled (ADR-1577).
- env.VMAFX_AUTH_* / env.VMAFX_JWKS_* would override the auth settings
  behind these checks; an empty rbac.allowedRoles would be dropped and the
  CRD would default it to reader and writer.

ADR-0794: multi-tenant auth gateway. ADR-1519: tenant registry.
*/ -}}
{{- $source := include "vmafx.tenantSource" . }}
{{- range $name, $_ := .Values.env }}
{{- if or (hasPrefix "VMAFX_AUTH_" $name) (hasPrefix "VMAFX_JWKS_" $name) }}
{{- fail (printf "env.%s: set auth settings through auth.*, not env (the auth guards cannot see env)" $name) }}
{{- end }}
{{- end }}
{{- range .Values.auth.tenants }}
{{- if and (hasKey . "rbac") (hasKey (.rbac | default dict) "allowedRoles") (empty .rbac.allowedRoles) }}
{{- fail (printf "auth.tenants %s: rbac.allowedRoles is empty (the CRD would default it to reader and writer)" .tenantId) }}
{{- end }}
{{- end }}
{{- if hasSuffix "vmafx-controller" .Values.image.repository }}
{{- fail (printf "image.repository %q: the server workload no longer runs the controller or receives auth settings; set controller.enabled (and controller.image) instead (ADR-1589)" .Values.image.repository) }}
{{- end }}
{{- range $name, $_ := .Values.controller.env }}
{{- if or (hasPrefix "VMAFX_AUTH_" $name) (hasPrefix "VMAFX_JWKS_" $name) (eq $name "VMAFX_SCORING_ROOTS") }}
{{- fail (printf "controller.env.%s: set auth settings through auth.*, not env (the auth guards cannot see env)" $name) }}
{{- end }}
{{- end }}
{{- if and .Values.controller.enabled (not .Values.auth.enabled) }}
{{- fail "controller.enabled needs auth.enabled: an identity provider (auth.issuer, auth.jwksEndpoint), a tenant registry (auth.tenants) or auth.disabled: true for development" }}
{{- end }}
{{- if .Values.auth.enabled }}
{{- if not .Values.controller.enabled }}
{{- fail "auth.enabled configures the controller workload: set controller.enabled: true (ADR-1589)" }}
{{- end }}
{{- if and $source .Values.auth.disabled }}
{{- fail "auth.disabled cannot be combined with a tenant registry (auth.tenants / auth.tenantSource)" }}
{{- end }}
{{- if and $source .Values.auth.scoringRoots }}
{{- fail "auth.scoringRoots is not used with a tenant registry: set scoring.roots on each auth.tenants entry (ADR-1577)" }}
{{- end }}
{{- else if $source }}
{{- fail "auth.tenants and auth.tenantSource need auth.enabled: true" }}
{{- else if .Values.auth.scoringRoots }}
{{- fail "auth.scoringRoots needs auth.enabled: true (only the vmafx-controller reads it)" }}
{{- end }}
