apiVersion: v1
kind: Pod
metadata:
  name: {{ include "vmafx.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmafx.labels" . | nindent 4 }}
    helm.sh/chart-test: "true"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
  containers:
    - name: wget
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - wget
        - --spider
        - --timeout=10
        - "http://{{ include "vmafx.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}/healthz"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
