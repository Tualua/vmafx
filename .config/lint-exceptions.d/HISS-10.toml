# Declared build-warnings gaps (praetor HISS-10, docs/guides/build-warnings.md in praetor): CI
# lanes that `praetorctl audit` reads as compiling without warnings as errors. Format and rules:
# scripts/ci/lint_exceptions.py. scripts/ci/praetor_tidy_coverage.py copies each entry into the
# `exceptions:` block of .standards.yaml, where praetor reads it; praetor accepts an expiry at most
# 90 days out and excuses every failing lane of the workflow an entry names. The gate reads the
# warnings-as-errors switch only as a literal on the build command, so the legs ADR-2170 gates
# through scripts/ci/werror-args.sh read as ungated too. ADR-2784 gives the decision;
# T-CI-PRAETOR-HISS10-LANES-2026-10-08 in docs/state.md tracks the lanes, #2438 (RC4 WP14) the work.

