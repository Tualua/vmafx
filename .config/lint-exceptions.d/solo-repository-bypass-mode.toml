# Declared exception to the solo-repository standard for the maintainer's ruleset bypass:
# the standard is bypass mode `pull_request`, the policy file declares `always`
# (ADR-3273). Format and rules: scripts/ci/lint_exceptions.py. Bound by
# scripts/dev/check_repository_security.py: without an unexpired entry here the declared
# mode is a finding, and an entry that outlives the mode is one too.

[[exception]]
path = ".github/repository-security-policy.json"
reason = "The merge train lands by direct push: stacked squash commits plus a render commit that no pull request owns, while the ruleset keeps one required approval (ADR-1252, ADR-1504). Pull-request mode would refuse every landing. The train's refusal of a head whose required contexts are not green is the guard meanwhile. Fix: the train merges through the forge API and the render commit lands through its own pull request, then the policy file declares `pull_request` and this entry is removed; renew only while the train still lands by push."
expires = 2027-01-09
