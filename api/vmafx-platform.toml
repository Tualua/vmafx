[[chart]]
path = "node.ebpf"
lead = '''

  # ebpf — the eBPF descriptor tracker (VMAFX_EBPF_BYPASS, ADR-1539, ADR-1593;
  # docs/development/ebpf-fuse-bypass.md). Needs storage.mode "mount" and
  # fuse.enabled. A non-root container process has no effective capabilities,
  # so the container runs as UID 0 with its capabilities dropped to BPF,
  # PERFMON and SYS_ADMIN, and the host's /sys/kernel/tracing is mounted
  # read-only (the loader finds the tracepoints there). mountPrefix is
  # VMAFX_EBPF_MOUNT_PREFIX (absolute, at most 255 bytes); storage.mountRoot
  # must lie under it and defaults to it.
'''

