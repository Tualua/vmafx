[[chart]]
path = "node.fuse"
lead = '''

  # fuse — FUSE in the node pods, which storage.mode "mount" needs (ADR-1593).
  # The node image carries the setuid helper fusermount3 and the util-linux
  # mount and umount it runs; the pod still needs the /dev/fuse device and the
  # capabilities fusermount3 mounts with:
  #   resourceName     the extended resource a FUSE device plugin advertises
  #                    for /dev/fuse (squat/generic-device-plugin with its
  #                    default domain: devic.es/fuse); one per pod. Required.
  #   appArmorProfile  container AppArmor profile. The runtimes' default
  #                    profile denies mount, so on AppArmor hosts set
  #                    {type: Unconfined} or a Localhost profile that allows
  #                    FUSE mounts. Empty: the runtime's default.
  # The container keeps running as UID 65532 with no effective capabilities;
  # its capability bounding set becomes SYS_ADMIN and DAC_READ_SEARCH and
  # allowPrivilegeEscalation true, which only the setuid fusermount3 uses.
  # Such a pod no longer meets the Pod Security "baseline" or "restricted"
  # profile. storage.mode "mount" without fuse.enabled is refused.
'''

[chart.schema]
type = "object"
additionalProperties = false
description = "FUSE in the node pods for storage.mode mount (ADR-1593): a FUSE device plugin's extended resource, SYS_ADMIN and DAC_READ_SEARCH in the capability bounding set for the setuid fusermount3, and an optional AppArmor profile."

