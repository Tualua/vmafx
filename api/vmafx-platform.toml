[[resources]]
kind = "VmafxTenant"
group = "vmafx"
doc = "VmafxTenant configures a named tenant's OIDC provider and RBAC policy for the vmafx-controller multi-tenant auth gateway (ADR-0794)."
short_names = ["vmtenant"]
spec = "VmafxTenantSpec"
status = "VmafxTenantStatus"
spec_required = true
printer_columns = [
  { name = "Issuer", type = "string", json_path = ".spec.oidc.issuer" },
  { name = "Enabled", type = "boolean", json_path = ".spec.enabled" },
  { name = "Age", type = "date", json_path = ".metadata.creationTimestamp" },
]

[[messages]]
name = "VmafxTenantSpec"
group = "vmafx"
doc = "VmafxTenantSpec defines a tenant: its identity provider, its role policy and the inputs it may score."
fields = [
  { name = "tenantId", type = "string", pattern = "^[a-z0-9][a-z0-9\\-]{0,62}[a-z0-9]$", doc = "TenantID is the unique, stable identifier of the tenant. It must match the \"tid\" (or configured tenant claim) in the OIDC tokens issued to this tenant's users." },
  { name = "enabled", type = "bool", optional = true, pointer = true, default = true, doc = "Enabled false rejects every request of the tenant with 403, even with an otherwise valid token: emergency suspension without revoking certificates." },
  { name = "oidc", type = "VmafxTenantOIDC", doc = "OIDC configures the tenant's identity provider." },
  { name = "rbac", type = "VmafxTenantRBAC", optional = true, doc = "RBAC is the tenant's role policy. The defaults enforce least privilege." },
  { name = "scoring", type = "VmafxTenantScoring", optional = true, doc = "Scoring names the inputs the tenant's callers may score (ADR-1577)." },
]

[[messages]]
name = "VmafxTenantOIDC"
group = "vmafx"
doc = "VmafxTenantOIDC is the OIDC provider configuration of a tenant."
fields = [
  { name = "issuer", type = "string", format = "uri", doc = "Issuer is the expected \"iss\" claim: the canonical base URL of the identity provider." },
  { name = "jwksEndpoint", go = "JWKSEndpoint", type = "string", format = "uri", doc = "JWKSEndpoint is the URL of the provider's JWKS endpoint, from which the RS256 public keys are fetched." },
  { name = "audience", type = "string", optional = true, doc = "Audience is the expected \"aud\" claim. Empty skips the audience check (not recommended in production)." },
  { name = "tenantClaim", type = "string", optional = true, default = "tid", doc = "TenantClaim is the JWT claim that holds the tenant identifier." },
  { name = "rolesClaim", type = "string", optional = true, default = "vmafx_roles", doc = "RolesClaim is the JWT claim that holds the list of vmafx roles (vmafx:reader, vmafx:writer, vmafx:admin, vmafx:node)." },
]

[[messages]]
name = "VmafxTenantRBAC"
group = "vmafx"
doc = "VmafxTenantRBAC is the role policy of a tenant."
fields = [
  { name = "defaultRole", type = "string", optional = true, enum = ["vmafx:reader", "vmafx:writer", "vmafx:admin"], default = "vmafx:reader", doc = "DefaultRole is the role of an authenticated user whose token names no vmafx role. vmafx:node is not offered: a compute node needs the role in its token." },
  { name = "allowedRoles", type = "string", repeated = true, optional = true, items_enum = ["vmafx:reader", "vmafx:writer", "vmafx:admin", "vmafx:node"], default = ["vmafx:reader", "vmafx:writer"], doc = "AllowedRoles lists the roles the tenant's users may hold; other roles in a token are dropped. vmafx:node is the compute node's role: it calls the node API and nothing else. List it for a tenant that runs its own nodes." },
]

[[messages]]
name = "VmafxTenantScoring"
group = "vmafx"
doc = "VmafxTenantScoring names the inputs a tenant's callers may score (ADR-1577)."
fields = [
  { name = "roots", type = "string", repeated = true, optional = true, max_items = 32, items_min_length = 1, doc = "Roots are absolute directories (/data/acme), http(s) URL prefixes (https://media.example.com/acme/) and rclone remote prefixes (s3:bucket/acme, s3://bucket/acme). \"..\" is refused. Empty or absent: the tenant may score nothing (deny by default)." },
]

[[messages]]
name = "VmafxTenantCondition"
group = "vmafx"
doc = "VmafxTenantCondition is one observation about a tenant."
fields = [
  { name = "type", type = "string", doc = "Type is the condition type." },
  { name = "status", type = "string", enum = ["True", "False", "Unknown"], doc = "Status is True, False or Unknown." },
  { name = "reason", type = "string", optional = true, doc = "Reason is a machine-readable reason for the status." },
  { name = "message", type = "string", optional = true, doc = "Message is a human-readable explanation." },
  { name = "lastTransitionTime", type = "Time", optional = true, doc = "LastTransitionTime is when the status last changed." },
]

[[messages]]
name = "VmafxTenantStatus"
group = "vmafx"
doc = "VmafxTenantStatus defines the observed state of a VmafxTenant."
fields = [
  { name = "conditions", type = "VmafxTenantCondition", repeated = true, optional = true, doc = "Conditions are the latest observations of the tenant." },
  { name = "observedGeneration", type = "int64", optional = true, doc = "ObservedGeneration is the generation the conditions describe." },
]
