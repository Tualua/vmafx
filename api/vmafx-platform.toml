[[chart]]
path = "auth"
lead = '''

# ---------------------------------------------------------------------------
# Auth — multi-tenant JWT / OIDC gateway (ADR-0794, ADR-1518, ADR-1519)
# ---------------------------------------------------------------------------
# The auth gateway is part of vmafx-controller, which the chart deploys with
# controller.enabled (ADR-1589). auth.enabled and controller.enabled go
# together; the chart refuses one without the other, and refuses
# image.repository naming a vmafx-controller image (the server workload no
# longer receives the auth settings).
#
# Two ways to verify tokens:
#   1. One identity provider for every tenant (auth.tenantSource ""): the
#      controller trusts jwksEndpoint / issuer below and takes the tenant from
#      each token's tenantClaim. Any tenant name the provider issues is
#      accepted.
#   2. A tenant registry (auth.tenantSource "kubernetes", implied when
#      auth.tenants is not empty): the controller reads the VmafxTenant
#      resources of the release namespace and accepts only their tenants, each
#      with its own identity provider, suspension switch and role whitelist.
#      The chart creates one VmafxTenant per auth.tenants entry and grants the
#      controller's own service account (<serviceAccount>-controller, and no
#      other account, ADR-1592) read access to VmafxTenants; resources
#      applied with kubectl are read the same way. jwksEndpoint, issuer,
#      audience, tenantClaim and rolesClaim below then only fill the fields an
#      auth.tenants entry leaves out; they are not passed to the controller.
#
# For internal / dev deployments set auth.disabled: true (sets
# VMAFX_AUTH_DISABLED=true: every request runs as tenant "dev" with
# vmafx:admin and vmafx:node).
#
# Quick-start (single tenant, Auth0):
#
#   controller:
#     enabled: true
#   auth:
#     enabled: true
#     tenants:
#       - tenantId: acme
#         oidc:
#           issuer: https://YOUR_DOMAIN.auth0.com/
#           jwksEndpoint: https://YOUR_DOMAIN.auth0.com/.well-known/jwks.json
#           audience: https://vmafx.example.com/api
#
# See docs/server/auth.md for the full OIDC configuration guide.
'''
schema_order = ["enabled", "disabled", "jwksEndpoint", "issuer", "audience", "tenantClaim", "rolesClaim", "scoringRoots", "tenantSource", "tenants"]

[chart.schema]
type = "object"
additionalProperties = true
description = "Multi-tenant JWT/OIDC gateway (ADR-0794). additionalProperties:true to accommodate per-tenant oidc and rbac sub-keys without exhaustive enumeration."

