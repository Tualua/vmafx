# ---------------------------------------------------------------------------
# Helm chart values (deploy/helm/vmafx/values.yaml, values.schema.json)
#
# One [[chart]] entry per key of values.yaml, in the order of the file: the
# dotted `path` (a key holding a dot in double quotes), the default `value`
# (none for a mapping whose keys follow, or for a key only the schema has), the
# comment and blank lines above the key verbatim (`lead`), an inline `note` and
# the column of its `#`, `quoted` for a string written in quotes it does not
# need, `literal` for a `|` block. [chart.schema] is the key's JSON schema
# without `properties`, which come from the entries below it; `schema_order`
# where the schema lists a mapping's keys in another order. A `$ref` of
# `k8s:<name>` is a Kubernetes type of the minimum supported minor
# (api/kubernetes/openapi-subset.json, scripts/codegen/k8s_openapi.py).
# Change an entry, then run python3 scripts/codegen/vmafx-api.py --write.
# ---------------------------------------------------------------------------

[chart_root]
schema_order = ["nameOverride", "fullnameOverride", "operator", "controller", "image", "imagePullSecrets", "workload", "deployment", "job", "statefulSet", "service", "ingress", "gpu", "resources", "env", "envFrom", "config", "persistence", "serviceAccount", "podAnnotations", "podSecurityContext", "securityContext", "affinity", "tolerations", "nodeSelector", "topologySpreadConstraints", "terminationGracePeriodSeconds", "livenessProbe", "readinessProbe", "monitoring", "pushgateway", "storage", "node", "podDisruptionBudget", "networkPolicy", "auth", "otelCollector"]

[chart_root.schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
title = "VMAFX Helm chart values"
description = "JSON Schema for deploy/helm/vmafx/values.yaml. Catches typos and invalid enum values at `helm install` / `helm upgrade` / `helm lint` time before they become silent template-rendering bugs."
type = "object"
additionalProperties = false
required = ["workload", "image", "gpu"]

[[chart_defs]]
name = "sloObjective"

[chart_defs.schema]
type = "number"
exclusiveMinimum = 0
exclusiveMaximum = 1
description = "An SLO objective: the share of good events, strictly between 0 and 1 (0.99 = 99 %)."

[[chart_defs]]
name = "promDuration"

[chart_defs.schema]
type = "string"
pattern = "^([0-9]+(ms|s|m|h|d|w|y))+$"
description = "A Prometheus duration such as 5m, 1h or 1h30m."

[[chart_defs]]
name = "burnRate"

[chart_defs.schema]
type = "object"
additionalProperties = false
required = ["longWindow", "shortWindow", "factor", "for"]
description = "One burn-rate rule: the ratio of bad events over longWindow and over shortWindow both above factor * (1 - objective), for the for duration."
properties = { longWindow = { "$ref" = "#/$defs/promDuration" }, shortWindow = { "$ref" = "#/$defs/promDuration" }, factor = { type = "number", exclusiveMinimum = 0 }, for = { "$ref" = "#/$defs/promDuration" } }

[[chart_defs]]
name = "durationOrEmpty"

[chart_defs.schema]
type = "string"
pattern = "^$|^([0-9]+(\\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$"
description = "A Go duration such as 30s or 2m; empty keeps the program's default."

[[chart_defs]]
name = "imageSpec"

[chart_defs.schema]
type = "object"
additionalProperties = false
properties = { repository = { type = "string" }, tag = { type = "string" }, pullPolicy = { type = "string", enum = ["Always", "IfNotPresent", "Never"] } }

[[chart_defs]]
name = "resourceSpec"

[chart_defs.schema]
"$ref" = "k8s:io.k8s.api.core.v1.ResourceRequirements"

[[chart_defs]]
name = "tokenSecretSpec"

[chart_defs.schema]
type = "object"
additionalProperties = false
description = "A Secret key holding a bearer token for the controller, mounted read-only and passed as VMAFX_CONTROLLER_TOKEN_FILE."
properties = { secretName = { type = "string" }, key = { type = "string", minLength = 1 } }

[[chart_defs]]
name = "volumeSpec"

[chart_defs.schema]
type = "object"
additionalProperties = false
properties = { enabled = { type = "boolean" }, size = { type = "string" }, mountPath = { type = "string" }, existingClaim = { type = "string" } }

[[chart]]
path = "nameOverride"
lead = '''
# =============================================================================
# VMAFX Helm chart — default values
