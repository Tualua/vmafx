[[chart]]
path = "podDisruptionBudget"
lead = '''
  # Example:
  # tenants:
  #   - tenantId: acme
  #     enabled: true
  #     oidc:
  #       issuer: https://acme.auth0.com/
  #       jwksEndpoint: https://acme.auth0.com/.well-known/jwks.json
  #       audience: vmafx-api
  #       tenantClaim: org_id
  #       rolesClaim: vmafx_roles
  #     rbac:
  #       defaultRole: vmafx:reader
  #       # vmafx:node: the role of this tenant's compute nodes (node API only).
  #       allowedRoles: [vmafx:reader, vmafx:writer, vmafx:node]
  #     # Inputs acme may score (ADR-1577); none means nothing is scored.
  #     scoring:
  #       roots: ["/media/acme", "s3:media/acme"]
  #   - tenantId: rival-corp
  #     oidc:
  #       issuer: https://keycloak.rival-corp.example/realms/vmafx
  #       jwksEndpoint: https://keycloak.rival-corp.example/realms/vmafx/protocol/openid-connect/certs

# ---------------------------------------------------------------------------
# PodDisruptionBudget
# Prevents Kubernetes from evicting all pods simultaneously during voluntary
# disruptions (node drains, cluster upgrades).
# Recommended when replicaCount >= 2.  Disabled by default for single-replica
# dev deployments where a PDB would block node-drain operations.
# Set minAvailable: 1 or maxUnavailable: 1 (mutually exclusive).
# ---------------------------------------------------------------------------
'''

[chart.schema]
type = "object"
additionalProperties = false
description = "PodDisruptionBudget prevents simultaneous eviction of all pods during voluntary disruptions (ADR-1058). Recommended when replicaCount >= 2."

[[chart]]
path = "podDisruptionBudget.enabled"
value = false

[chart.schema]
type = "boolean"

[[chart]]
path = "podDisruptionBudget.minAvailable"

[chart.schema]
oneOf = [{ type = "integer", minimum = 0 }, { type = "string", pattern = "^[0-9]+%$" }]
description = "Minimum number (or percentage) of pods that must remain available. Mutually exclusive with maxUnavailable."

[[chart]]
path = "podDisruptionBudget.maxUnavailable"
lead = '''
  # maxUnavailable: 1 allows exactly one voluntary disruption at a time
  # (node drain, cluster upgrade) while keeping the rest of the replicas
  # serving.  This is the correct default for both single-replica dev
  # deployments and multi-replica production — minAvailable: 1 with a
  # single-replica Deployment would permanently block node drain operations
  # (Kubernetes cannot evict the only replica and still satisfy minAvailable).
  # Switch to minAvailable when you need a hard lower-bound on serving capacity
  # (e.g., minAvailable: 2 with replicaCount: 3).
'''
value = 1

[chart.schema]
oneOf = [{ type = "integer", minimum = 0 }, { type = "string", pattern = "^[0-9]+%$" }]
description = "Maximum number (or percentage) of pods that may be unavailable. Mutually exclusive with minAvailable."

