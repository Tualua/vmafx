# Layered over aarch64-linux-gnu.ini (meson reads several --cross-file
# arguments in order) on a distribution whose user-mode emulator is
# `qemu-aarch64`: Ubuntu 26.04 ships `qemu-user` and no `qemu-user-static`.
# The arm64 clang-tidy lane configures with both files in the dev container
# (ADR-1471).
[binaries]
exe_wrapper = ['qemu-aarch64', '-L', '/usr/aarch64-linux-gnu']
