# Cross file: clang targeting aarch64 Linux, run through qemu-user.
#
# The clang twin of aarch64-linux-gnu.ini, for checking that a clang build and
# a GCC build of the library agree (ADR-1461) and for the aarch64 golden gate
# (`make test-netflix-golden-arm64 GOLDEN_ARM64_CC=clang`).
#
# clang uses the GCC cross toolchain's C library, libstdc++ and linker
# support files. `--sysroot` and `--gcc-toolchain` name where the Arch
# packages `aarch64-linux-gnu-glibc` and `aarch64-linux-gnu-gcc` put them; on
# a distribution with another layout (Debian's multiarch cross packages),
# copy this file, drop or adjust the two options and pass the copy as
# GOLDEN_ARM64_CROSS_FILE. lld links, because the host's ld is not a cross
# linker.
[binaries]
c = ['clang', '--target=aarch64-linux-gnu', '--sysroot=/usr/aarch64-linux-gnu', '--gcc-toolchain=/usr']
cpp = ['clang++', '--target=aarch64-linux-gnu', '--sysroot=/usr/aarch64-linux-gnu', '--gcc-toolchain=/usr']
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
exe_wrapper = ['qemu-aarch64-static', '-L', '/usr/aarch64-linux-gnu']

[built-in options]
c_link_args = ['-fuse-ld=lld']
cpp_link_args = ['-fuse-ld=lld']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
